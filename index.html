<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Web Chess</title>
<style>
body {
    text-align: center;
    font-family: Arial;
}
#board {
    width: 480px;
    height: 480px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 4px solid black;
}
.square {
    width: 60px;
    height: 60px;
    font-size: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}
.white { background: #f0d9b5; }
.black { background: #b58863; }
.selected { background: yellow !important; }
</style>
</head>
<body>

<h1>♟️ Web Chess</h1>
<h3 id="turn">Navbat: White</h3>
<div id="board"></div>

<script>
const boardElement = document.getElementById("board");
const turnText = document.getElementById("turn");

let selected = null;
let turn = "white";

const pieces = {
    r: "♜", n: "♞", b: "♝", q: "♛", k: "♚", p: "♟",
    R: "♖", N: "♘", B: "♗", Q: "♕", K: "♔", P: "♙"
};

let board = [
["r","n","b","q","k","b","n","r"],
["p","p","p","p","p","p","p","p"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["P","P","P","P","P","P","P","P"],
["R","N","B","Q","K","B","N","R"]
];

function drawBoard() {
    boardElement.innerHTML = "";
    for(let row=0; row<8; row++){
        for(let col=0; col<8; col++){
            const square = document.createElement("div");
            square.classList.add("square");
            square.classList.add((row+col)%2==0 ? "white":"black");
            square.dataset.row = row;
            square.dataset.col = col;
            square.innerHTML = pieces[board[row][col]] || "";
            square.onclick = () => selectSquare(row,col);
            boardElement.appendChild(square);
        }
    }
}

function selectSquare(row,col){
    const piece = board[row][col];

    if(selected){
        movePiece(selected.row, selected.col, row, col);
        selected = null;
        drawBoard();
        return;
    }

    if(piece !== ""){
        if(turn === "white" && piece === piece.toUpperCase()){
            selected = {row,col};
        }
        if(turn === "black" && piece === piece.toLowerCase()){
            selected = {row,col};
        }
    }
}

function movePiece(r1,c1,r2,c2){
    const piece = board[r1][c1];
    if(piece === "") return;

    // oddiy yurish (validatsiyasiz)
    board[r2][c2] = piece;
    board[r1][c1] = "";

    turn = turn === "white" ? "black" : "white";
    turnText.innerText = "Navbat: " + (turn === "white" ? "White":"Black");
}

drawBoard();
</script>

</body>
</html>
